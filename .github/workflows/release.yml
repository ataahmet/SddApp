# Publishes the SDD kit (sdd.tar.gz + .sha256) and its install.sh on every
# version tag. KIT_VERSION, not SDD_VERSION: install.sh reads SDD_VERSION as the
# version to download. Tag with
#   scripts/sdd-release bump <patch|minor|major>   (updates VERSION, commits, tags)
#   git push origin HEAD v0.2.0
# install.sh then picks it up as `latest` (releases/latest/download/sdd.tar.gz).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the installer and the CLI
        run: shellcheck -S error install.sh scripts/sdd scripts/sdd-release scripts/lib/*.sh

      - name: Check the tag matches VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($v). Tag releases with: scripts/sdd-release bump <patch|minor|major>"
            exit 1
          fi
          echo "KIT_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build the kit
        run: bash scripts/sdd-release --version "$KIT_VERSION" --out dist

      - name: Smoke-test install → new → list → update in a fresh project
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/proj" && mkdir -p "$proj" && cd "$proj" && git init -q
          SDD_TARBALL="$GITHUB_WORKSPACE/dist/sdd.tar.gz" bash "$GITHUB_WORKSPACE/install.sh"
          ./scripts/sdd version | grep -Fx "sdd $KIT_VERSION"
          ./scripts/sdd new feature "Smoke test" < /dev/null
          ./scripts/sdd list | grep -F "001-smoke-test"
          ./scripts/sdd setup-user
          git check-ignore -q sddapp/deny-list.txt
          jq -e '.permissions.deny | index("Read(.env)")' sddapp/claude-settings.json
          jq -e '.hooks == "hooks.json"' sddapp/copilot-plugin/plugin.json
          echo '{"toolArgs":{"path":"app/local.properties"}}' | bash scripts/lib/copilot-deny-hook.sh | jq -e '.permissionDecision == "deny"'
          test -z "$(echo '{"toolArgs":{"path":"app/Main.kt"}}' | bash scripts/lib/copilot-deny-hook.sh)"
          SDD_TARBALL="$GITHUB_WORKSPACE/dist/sdd.tar.gz" bash "$GITHUB_WORKSPACE/dist/install.sh" --update

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "sdd $KIT_VERSION" --generate-notes
